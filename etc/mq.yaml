mq:
  producer:
    group_member_add:
      topic: hermet.group_member.add
  consumer:
    group_member_add:
      topic: hermet.group_member.add
      group_id: hermet-group-member-add-group
      partitions: 6
      handle_timeout: 16s  # 成员添加有指数退避重试机制 ( 1s -> 2s -> 4s ) 需要一个稍长的超时时间
    message_upstream:
      topic: synp.message.upstream
      group_id: hermet-message-upstream-group
      partitions: 6
      handle_timeout: 16s

  cdc:
    user:
      group_id: hermet-user-processor
      handle_timeout: 10s
      db_shard_count: 2
      tb_shard_count: 4
    contact_review:
      group_id: hermet-contact-review-processor
      handle_timeout: 10s
      db_shard_count: 2
      tb_shard_count: 4
    contact:
      group_id: hermet-contact-processor
      handle_timeout: 10s
      db_shard_count: 2
      tb_shard_count: 4
    group:
      group_id: hermet-group-processor
      handle_timeout: 10s
      db_shard_count: 2
      tb_shard_count: 4
    group_member:
      group_id: hermet-group-member-processor
      handle_timeout: 10s
      db_shard_count: 2
      tb_shard_count: 4
    user_group:
      group_id: hermet-user-group-processor
      handle_timeout: 10s
      db_shard_count: 2
      tb_shard_count: 4
    outbox_event:
      group_id: hermet-group-member-outbox-processor
      handle_timeout: 10s
      db_shard_count: 2
      tb_shard_count: 4
