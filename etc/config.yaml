profile:
  env: dev

hermet:
  web:
    addr: :10081
    read_header_timeout: 5s # 读取请求头超时，防止 Slowloris 攻击
    read_timeout: 15s       # 读取整个请求超时，IM 请求通常较小
    write_timeout: 90s      # 写响应超时，历史记录数据量可能较大
    idle_timeout: 120s      # Keep-Alive 空闲超时，IM 客户端会频繁请求

  session:
    expiration: 12h

  cors:
    max_age: 86400s
    hostnames:
      - localhost

  ignores:
    - /api/v1/auth/sign-in
    - /api/v1/auth/refresh-token

  grpc:
    client:
      message_push:
        key_prefix: /synp
        resolver_timeout: 1s
        keepalive_time: 1m
        keepalive_timeout: 10s
      node_locate:
        key_prefix: /synp
        resolver_timeout: 1s
        keepalive_time: 1m
        keepalive_timeout: 10s

  task_pool:
    init_goroutines: 64
    core_goroutines: 128
    max_goroutines: 256
    queue_size: 1024
    queue_backlog_rate: 0.30
    max_idle_time: 20s
    submit_timeout: 80ms
    task_exec_timeout: 800ms
    err_queue_size: 1024
    err_worker_cnt: 2
    err_handle_timeout: 500ms

jwt:
  access:
    expiration: 1h   # Access Token 过期时间
    issuer: hermet-access
    private: |
      -----BEGIN PRIVATE KEY-----
      MC4CAQAwBQYDK2VwBCIEINuchwbkYeYD/jnGLyPjRAufQGP+WUckh+PK6U4u7fk1
