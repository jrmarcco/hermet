    #   client_secret: b7rQYTc0y3eqDkGXFYD2UIPjYJeFCaAC
      # 建议使用环境变量存储敏感信息
      # client_secret: ${KAFKA_OAUTH_CLIENT_SECRET}

mq:
  producer:
    group_member_add:
      topic: hermet.group_member.add
  consumer:
    group_member_add:
      topic: hermet.group_member.add
      group_id: hermet-group-member-add-group
      partitions: 6
      handle_timeout: 16s  # 成员添加有指数退避重试机制 ( 1s -> 2s -> 4s ) 需要一个稍长的超时时间
    message_upstream:
      topic: synp.message.upstream
      group_id: hermet-message-upstream-group
      partitions: 6
      handle_timeout: 16s

  cdc:
    user:
      group_id: hermet-user-processor
      handle_timeout: 10s
      db_shard_count: 2
      tb_shard_count: 4
    contact_review:
      group_id: hermet-contact-review-processor
      handle_timeout: 10s
      db_shard_count: 2
      tb_shard_count: 4
    contact:
      group_id: hermet-contact-processor
      handle_timeout: 10s
      db_shard_count: 2
      tb_shard_count: 4
    group:
      group_id: hermet-group-processor
      handle_timeout: 10s
      db_shard_count: 2
      tb_shard_count: 4
    group_member:
      group_id: hermet-group-member-processor
      handle_timeout: 10s
      db_shard_count: 2
      tb_shard_count: 4
    user_group:
      group_id: hermet-user-group-processor
      handle_timeout: 10s
      db_shard_count: 2
      tb_shard_count: 4
    outbox_event:
      group_id: hermet-group-member-outbox-processor
      handle_timeout: 10s
      db_shard_count: 2
      tb_shard_count: 4

# 数据库配置
db:
  log_level: info
  slow_threshold: 200ms # 慢查询阈值
  ignore_record_not_found_error: true
  # sslmode=disable 用于开发环境，线上一般推荐使用 sslmode=require / sslmode=verify-ca ( 更高安全性 ) / sslmode=verify-full ( 最高安全性 )
  sharding:
    - name: hermet_0
      dsn: "postgres://hermet_0:%3Cpasswd%3E@192.168.3.3:15432/hermet_0?sslmode=disable&connect_timeout=1&statement_timeout=3000&idle_in_transaction_session_timeout=3000"
    - name: hermet_1
      dsn: "postgres://hermet_1:%3Cpasswd%3E@192.168.3.3:25432/hermet_1?sslmode=disable&connect_timeout=1&statement_timeout=3000&idle_in_transaction_session_timeout=3000"

