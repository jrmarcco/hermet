# hermet backend 容器运行配置 ( 基于 etc/config.yaml, 面向 192.168.3.3 中间件集群 )。
# 与原版的差异:
# - etcd 认证用户改为 synp ( 服务器已启用的注册/发现用户, 见 gateway 仓库
#   scripts/docker/etcd/docker-compose.yaml 尾部实例 ), hermet 用户未创建
# - etcd tls.server_name 置空: 服务器证书 SAN 为 node-1/2/3/localhost/192.168.3.3,
#   置空后按 endpoint 主机名 ( 192.168.3.3 ) 校验
# - etcd/kafka 内联证书已替换为服务器当前签发版本
# - grpc.server.addr 广播本机宿主机局域网 IP ( 192.168.3.127 )
hermet:
  # 日志配置
  # mode:  dev ( 单行紧凑格式 ) | prod ( JSON，面向采集 )
  # level: debug | info | warn | error
  # color: auto | always | never ( 仅 dev 生效 )
  # file:  可选落盘段 ( 终端 + 文件双写，lumberjack 按大小轮转 )
  #   file:
  #     path: /var/log/hermet/hermet.log
  #     max_size_mb: 100    # 单文件上限，超过切割
  #     max_backups: 7      # 保留旧文件份数 ( 0 保留全部 )
  #     max_age_days: 30    # 旧文件保留天数 ( 0 不限 )
  #     compress: true      # 旧文件 gzip 压缩
  log:
    mode: dev
    level: info

  web:
    addr: :10081
    read_header_timeout: 5s # 读取请求头超时，防止 Slowloris 攻击
    read_timeout: 15s       # 读取整个请求超时，IM 请求通常较小
    write_timeout: 90s      # 写响应超时，历史记录数据量可能较大
    idle_timeout: 120s      # Keep-Alive 空闲超时，IM 客户端会频繁请求

  # 运维管理端口 ( /metrics + /debug/pprof )，与业务端口隔离；留空则不启用。
  admin:
    addr: ":10090"
    shutdown_timeout: 5s

  session:
    expiration: 12h

  cors:
    max_age: 86400s
    hostnames:
      - localhost

  ignores:
    - /api/v1/auth/sign-in
    - /api/v1/auth/refresh-token
    - /.well-known/jwks.json

  # gRPC 服务端 ( SyncService，网关经服务发现调用 synp:///synp-backend )。
  grpc:
    server:
      name: synp-backend
      # 广播本机宿主机局域网 IP ( Windows 主机, 容器 10091 已发布到宿主机 )。
      addr: 192.168.3.127:10091
      group: synp
      registry:
        key_prefix: synp
        lease_ttl: 30 # 单位：秒 ( 与 etcd api 保持一致 )
        timeout: 10s

    # 网关 NotifyService 客户端 ( Kafka 通知链路之外的即时通道，尽力而为 )。
    client:
      notify:
        key_prefix: synp
        resolver_timeout: 1s
        keepalive_time: 1m
        keepalive_timeout: 10s

  # 消息扇出配置
  message:
    # 写扩散/读扩散阈值 ( 部署参数，网关与客户端均不感知 ):
    # 群成员数 <= 阈值走写扩散 ( 收件箱内联正本，一次 SYNC 即可渲染 )，
    # 超过阈值走读扩散 ( 收件箱只写轻量指针，客户端再发起 CONVERSATION_SYNC 拉取正文 )。
    fanout_inline_threshold: 500
    # 群扇出每批成员数 ( 每批一个分片事务，受 statement_timeout 约束 )。
    fanout_batch_size: 500

  task_pool:
    init_goroutines: 64
    core_goroutines: 128
    max_goroutines: 256
    queue_size: 1024
    queue_backlog_rate: 0.30
    max_idle_time: 20s
    submit_timeout: 80ms
    task_exec_timeout: 800ms
    err_queue_size: 1024
    err_worker_cnt: 2
    err_handle_timeout: 500ms

