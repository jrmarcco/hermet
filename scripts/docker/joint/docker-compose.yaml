# 联调轻量依赖: Redis + etcd ( 无 TLS 单节点 )。
#
# 用途: gateway × backend 本地联调 ( 消息主链路验证 )。
# - Redis: session / 连接注册表 ( 两服务共用 )。
# - etcd: gRPC 服务发现 ( gateway 强制需要; 联调免 TLS,
#   生产用 ../gateway etcd 的 TLS 三节点部署 )。
services:
  redis:
    image: redis:7-alpine
    container_name: joint-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    command: ["redis-server", "--appendonly", "no"]
    networks:
      - jrmarcco_net

  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: joint-etcd
    restart: unless-stopped
    # 联调单节点免 TLS 免认证; 数据不落盘 ( 销毁即重置 )。
    command:
      - etcd
      - --name=etcd-joint
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
    ports:
      - "12379:2379"
    networks:
      - jrmarcco_net

networks:
  jrmarcco_net:
    external: true
