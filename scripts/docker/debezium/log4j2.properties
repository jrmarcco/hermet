# Log4j2 配置文件
# 根日志级别
rootLogger.level = INFO
rootLogger.appenderRefs = stdout
rootLogger.appenderRef.stdout.ref = STDOUT

# Console Appender
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%d{ISO8601}] %p %m (%c) [%t]%n

# Debezium 日志级别
logger.debezium.name = io.debezium
logger.debezium.level = INFO

# Kafka Connect 日志级别
logger.connect.name = org.apache.kafka.connect
logger.connect.level = INFO

# Kafka Connect REST API ( 减少噪音 )
logger.connectrest.name = org.apache.kafka.connect.runtime.rest
logger.connectrest.level = WARN

# Reflections 库 ( 减少噪音 )
logger.reflections.name = org.reflections
logger.reflections.level = ERROR

# Kafka 客户端日志
logger.kafka.name = org.apache.kafka
logger.kafka.level = WARN

# 如果需要调试 Debezium，可以启用以下配置
# logger.debezium.level = DEBUG
# logger.debeziumSnapshot.name = io.debezium.relational.history
# logger.debeziumSnapshot.level = DEBUG
