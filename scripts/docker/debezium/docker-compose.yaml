x-debezium-common: &debezium-common
  image: quay.io/debezium/connect:latest
  restart: unless-stopped
  networks:
    - jrmarcco_net
  volumes:
      - ./certs:/kafka/certs:ro
      - ./connectors:/kafka/connectors:ro
      - ./log4j2.properties:/kafka/config/log4j2.properties:ro
  environment: &debezium-common-env
    GROUP_ID: ${DEBEZIUM_GROUP_ID}
    # Kafka 集群配置
    BOOTSTRAP_SERVERS: kafka-1:9093,kafka-2:9093,kafka-3:9093
    CONFIG_STORAGE_TOPIC: debezium_connect_configs
    OFFSET_STORAGE_TOPIC: debezium_connect_offsets
    STATUS_STORAGE_TOPIC: debezium_connect_statuses

    # 副本因子配置 ( 与 Kafka 集群配置匹配 )
    CONFIG_STORAGE_REPLICATION_FACTOR: 3
    OFFSET_STORAGE_REPLICATION_FACTOR: 3
    STATUS_STORAGE_REPLICATION_FACTOR: 3

    # Kafka Connect 配置
    KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: false
    CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: false

    CONNECT_SECURITY_PROTOCOL: SSL
    CONNECT_SSL_KEYSTORE_LOCATION: /kafka/certs/kafka.client.keystore.jks
    CONNECT_SSL_KEYSTORE_PASSWORD: ${KAFKA_TLS_KEY_PASSWORD}
    CONNECT_SSL_KEYSTORE_TYPE: JKS
    CONNECT_SSL_KEY_PASSWORD: ${KAFKA_TLS_KEY_PASSWORD}
    CONNECT_SSL_TRUSTSTORE_LOCATION: /kafka/certs/kafka.client.truststore.jks
    CONNECT_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_TLS_KEY_PASSWORD}
    CONNECT_SSL_TRUSTSTORE_TYPE: JKS

    CONNECT_PRODUCER_SECURITY_PROTOCOL: SSL
    CONNECT_PRODUCER_SSL_KEYSTORE_LOCATION: /kafka/certs/kafka.client.keystore.jks
    CONNECT_PRODUCER_SSL_KEYSTORE_PASSWORD: ${KAFKA_TLS_KEY_PASSWORD}
    CONNECT_PRODUCER_SSL_KEYSTORE_TYPE: JKS
    CONNECT_PRODUCER_SSL_KEY_PASSWORD: ${KAFKA_TLS_KEY_PASSWORD}
    CONNECT_PRODUCER_SSL_TRUSTSTORE_LOCATION: /kafka/certs/kafka.client.truststore.jks
    CONNECT_PRODUCER_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_TLS_KEY_PASSWORD}
    CONNECT_PRODUCER_SSL_TRUSTSTORE_TYPE: JKS

    CONNECT_CONSUMER_SECURITY_PROTOCOL: SSL
    CONNECT_CONSUMER_SSL_KEYSTORE_LOCATION: /kafka/certs/kafka.client.keystore.jks
    CONNECT_CONSUMER_SSL_KEYSTORE_PASSWORD: ${KAFKA_TLS_KEY_PASSWORD}
    CONNECT_CONSUMER_SSL_KEYSTORE_TYPE: JKS
    CONNECT_CONSUMER_SSL_KEY_PASSWORD: ${KAFKA_TLS_KEY_PASSWORD}
    CONNECT_CONSUMER_SSL_TRUSTSTORE_LOCATION: /kafka/certs/kafka.client.truststore.jks
    CONNECT_CONSUMER_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_TLS_KEY_PASSWORD}
    CONNECT_CONSUMER_SSL_TRUSTSTORE_TYPE: JKS

    # 日志级别 ( Log4j2 )
    LOG_LEVEL: INFO
    # 使用 Log4j2 配置文件
    KAFKA_LOG4J_OPTS: "-Dlog4j2.configurationFile=file:/kafka/config/log4j2.properties"
  healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  jrmarcco_net:
    external: true

services:
  hermet-0-connector:
    <<: *debezium-common
    hostname: hermet-0-connector
    container_name: hermet-0-connector
    ports:
      - "18083:8083"
    environment:
      <<: *debezium-common-env

  hermet-1-connector:
    <<: *debezium-common
    hostname: hermet-1-connector
    container_name: hermet-1-connector
    ports:
      - "28083:8083"
    environment:
      <<: *debezium-common-env

  mongodb-connector:
    <<: *debezium-common
    hostname: mongodb-connector
    container_name: mongodb-connector
    ports:
      - "38083:8083"
    environment:
      <<: *debezium-common-env
